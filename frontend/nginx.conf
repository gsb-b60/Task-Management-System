server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html is the only unhashed entry point: never let browsers or
  # proxies serve a stale copy, or users stay pinned to an old bundle
  # (and old UI) after each deploy.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
